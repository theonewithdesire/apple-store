<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Details</title>
    <link rel="stylesheet" href="styles.css"> <!-- Using the same main stylesheet -->
    <style>
        /* Additional or overridden styles for this page */
        .app-detail-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-top: 2rem;
        }
        .app-detail-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--primary-light);
        }
        .app-icon-placeholder { /* If no real icon is available */
            width: 100px;
            height: 100px;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 20px; /* Matches iOS icon style */
            text-transform: uppercase;
        }
        .app-title-section h2 {
            font-size: 2.2rem;
            color: var(--text-dark);
            margin-bottom: 0.3rem;
        }
        .app-title-section .developer-name { /* If you have developer name */
            font-size: 1rem;
            color: var(--accent);
        }
        .app-description {
            margin-bottom: 1.5rem;
            line-height: 1.8;
            white-space: pre-wrap; /* To preserve spaces and newlines in description */
        }
        .app-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .meta-item {
            background-color: var(--background);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .meta-item strong {
            display: block;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .download-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
            text-align: center;
        }
        .download-button:hover {
            background-color: var(--primary-dark);
        }
        .rating-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--primary-light);
        }
        .rating-section .stars {
            font-size: 1.8rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <!-- Header can be similar to the main page or slightly different -->
        <h1 id="appDetailHeaderTitle">App Details</h1>
        <p><a href="index.html" style="color: var(--text-light); text-decoration:none;">← Back to App List</a></p>
    </header>
    
    <main>
        <a href="index.html" class="back-link">← Back to List</a>
        <div id="appDetailContainer" class="app-detail-container">
            <!-- App details content will be loaded here by JavaScript -->
            <div class="loading">Loading app details...</div>
        </div>
    </main>
    
    <footer>
        <p>Apple Store Data Viewer - App Detail</p>
    </footer>

    <script src="app-detail.js"></script> <!-- New JavaScript file for this page -->
</body>
</html>
